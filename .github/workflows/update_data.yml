name: Update SCHD Quant Data

on:
  schedule:
    - cron: '10 14 * * 1-5'
    - cron: '15 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Run generate_radar_data.py
        run: python generate_radar_data.py

      - name: Commit and Push updated schd_data.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add schd_data.json index.html
          git diff --staged --quiet || git commit -m "chore: auto-update schd_data.json and seo summary"
          git push
