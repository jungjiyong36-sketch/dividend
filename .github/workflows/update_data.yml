name: Update SCHD Radar Data

on:
  schedule:
    - cron: '0 14,16,18 * * 1-5'
    - cron: '15 20,21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas requests

      - name: Run Quant Data Engine & Static SEO Baker
        run: |
          python generate_radar_data.py

      - name: Commit and Push Updated SEO Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add schd_data.json sitemap.xml index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update SCHD quant data and SEO snapshot [skip ci]" && git push)
