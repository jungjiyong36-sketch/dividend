name: Update SCHD Radar Data

on:
  schedule:
    - cron: '0 14 * * 1-5'
    - cron: '0 15 * * 1-5'
    - cron: '15 20 * * 1-5'
    - cron: '15 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # cache: 'pip' 라인 제거

      - name: Install Dependencies
        run: |
          pip install yfinance pandas requests

      - name: Run Data Engine
        run: |
          python generate_radar_data.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add schd_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto Update SCHD Radar Data [skip ci]" && git push)
