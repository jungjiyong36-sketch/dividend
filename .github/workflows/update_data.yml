name: Update SCHD Radar Data

on:
  schedule:
    # 1. 미국장 개장 30분 후 (서머타임 EDT: UTC 14:00 / 겨울 EST: UTC 15:00 대응을 위해 2회 체크)
    - cron: '0 14 * * 1-5'
    - cron: '0 15 * * 1-5'
    # 2. 미국장 마감 직후 (서머타임 EDT: UTC 20:15 / 겨울 EST: UTC 21:15)
    - cron: '15 20 * * 1-5'
    - cron: '15 21 * * 1-5'
  workflow_dispatch: # 수동 즉시 실행 지원

permissions:
  contents: write

jobs:
  update-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas requests

      - name: Run Data Engine
        run: |
          python generate_radar_data.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add schd_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto Update SCHD Radar Data [skip ci]" && git push)
